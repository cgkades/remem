name: remem-test

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: remem_test
      POSTGRES_USER: remem_test
      POSTGRES_PASSWORD: remem_test
    ports:
      - "127.0.0.1:54330:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remem_test -d remem_test"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    volumes:
      - remem-test-postgres-data:/var/lib/postgresql/data

volumes:
  remem-test-postgres-data:
