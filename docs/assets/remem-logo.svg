<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">ReMem logo</title>
  <desc id="desc">A neon brain network connected to a database stack above the ReMem wordmark and Remember What Matters tagline.</desc>
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#40e9ff"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38d8ff"/>
      <stop offset="0.48" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#b82cff"/>
    </linearGradient>
    <radialGradient id="node">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#9ff7ff"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="520" rx="36" fill="#050914"/>

  <g transform="translate(155 48)" fill="none" stroke="url(#neon)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M170 25c-34-1-58 14-72 41-35-3-61 16-71 48-30 9-47 34-44 64-20 22-21 53-4 76-8 32 8 61 37 75 6 35 36 56 70 52 23 24 58 30 86 13 31 11 63-1 80-29 32-8 52-35 50-67 22-22 24-54 7-79 8-31-6-61-34-77 0-34-24-61-57-67-9-31-34-50-66-50-8 0-15 0-22 0z"/>
    <path d="M92 118c34 18 60 48 77 87M88 270c40-7 71-32 92-70M175 90c-12 35-12 74 0 112M174 201c31-28 66-42 104-45M175 202c34 11 65 34 88 66" stroke-width="7"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="242" cy="166" r="14" fill="url(#node)"/>
    <circle cx="306" cy="120" r="13" fill="url(#node)"/>
    <circle cx="340" cy="250" r="17" fill="url(#node)"/>
    <circle cx="244" cy="320" r="13" fill="url(#node)"/>
    <circle cx="395" cy="173" r="12" fill="url(#node)"/>
    <circle cx="405" cy="290" r="12" fill="url(#node)"/>
  </g>

  <g transform="translate(545 105)" stroke="url(#neon)" stroke-width="10" fill="#111a55" filter="url(#glow)">
    <ellipse cx="110" cy="36" rx="105" ry="34"/>
    <path d="M5 36v60c0 19 47 34 105 34s105-15 105-34V36"/>
    <ellipse cx="110" cy="96" rx="105" ry="34"/>
    <path d="M5 96v60c0 19 47 34 105 34s105-15 105-34V96"/>
    <ellipse cx="110" cy="156" rx="105" ry="34"/>
  </g>

  <g fill="none" stroke="url(#neon)" stroke-width="8" stroke-linecap="round" filter="url(#glow)">
    <path d="M407 178c70 0 74-40 144-40"/>
    <path d="M416 239c58 0 78 10 135 10"/>
    <path d="M406 292c72 0 80 17 145 17"/>
  </g>

  <text x="480" y="430" text-anchor="middle" fill="url(#word)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="92" font-weight="750" letter-spacing="-3">ReMem</text>
  <text x="480" y="478" text-anchor="middle" fill="#b9c5e2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" letter-spacing="8">REMEMBER WHAT MATTERS</text>
</svg>
