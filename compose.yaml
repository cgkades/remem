name: remem

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${REMEM_POSTGRES_DB:-remem}
      POSTGRES_USER: ${REMEM_POSTGRES_USER:-remem}
      POSTGRES_PASSWORD: ${REMEM_POSTGRES_PASSWORD:?set REMEM_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${REMEM_POSTGRES_PORT:-54329}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    volumes:
      - remem-postgres-data:/var/lib/postgresql/data

volumes:
  remem-postgres-data:
