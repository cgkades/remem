name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_DB: remem_test
          POSTGRES_USER: remem
          POSTGRES_PASSWORD: remem-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remem -d remem_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          REMEM_TEST_DATABASE_URL: postgres://remem:remem-ci-password@127.0.0.1:5432/remem_test
      - run: npm run pack:check
      - run: npm run pack:smoke

  opencode-v2-e2e:
    name: OpenCode v2 beta E2E
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:opencode-v2
      - if: failure() && env.REMEM_E2E_WORKSPACE != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opencode-v2-e2e-workspace
          path: ${{ env.REMEM_E2E_WORKSPACE }}
          retention-days: 3
