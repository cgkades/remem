name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_DB: remem_test
          POSTGRES_USER: remem
          POSTGRES_PASSWORD: remem-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remem -d remem_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          REMEM_TEST_DATABASE_URL: postgres://remem:remem-ci-password@127.0.0.1:5432/remem_test
      - run: npm run pack:check
      - run: npm run pack:smoke

  opencode-v1-e2e:
    name: OpenCode v1.18.27 E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install verified OpenCode v1.18.27 runtime
        run: |
          archive="$RUNNER_TEMP/opencode-linux-x64.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/anomalyco/opencode/releases/download/v1.18.27/opencode-linux-x64.tar.gz \
            --output "$archive"
          echo "4af5494f9433f59db8c1e344198f0ee72a50c06ec009fb4a8aeab4c2d4abd702  $archive" \
            | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/opencode-v1"
          tar -xzf "$archive" -C "$RUNNER_TEMP/opencode-v1"
      - name: Install verified OpenCode v1.18.29 runtime
        run: |
          archive="$RUNNER_TEMP/opencode-linux-x64-1.18.29.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/anomalyco/opencode/releases/download/v1.18.29/opencode-linux-x64.tar.gz \
            --output "$archive"
          echo "ea800b7ff56226b70952126c9fc1e2517ca4c4b5682fd9d3f9e87449697a1194  $archive" \
            | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/opencode-v1-18-29"
          tar -xzf "$archive" -C "$RUNNER_TEMP/opencode-v1-18-29"
      - run: npm run test:opencode-v1:1-18-29
        env:
          OPENCODE_BIN: ${{ runner.temp }}/opencode-v1-18-29/opencode
      - run: npm run test:opencode-v1
        env:
          OPENCODE_BIN: ${{ runner.temp }}/opencode-v1/opencode
      - run: npm run test:opencode-v1:package
        env:
          OPENCODE_BIN: ${{ runner.temp }}/opencode-v1/opencode

  opencode-v2-e2e:
    name: OpenCode v2 beta E2E
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_DB: remem_test
          POSTGRES_USER: remem
          POSTGRES_PASSWORD: remem-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remem -d remem_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:opencode-v2
        env:
          REMEM_TEST_DATABASE_URL: postgres://remem:remem-ci-password@127.0.0.1:5432/remem_test
      - if: failure() && env.REMEM_E2E_WORKSPACE != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opencode-v2-e2e-workspace
          path: ${{ env.REMEM_E2E_WORKSPACE }}
          retention-days: 3

  pi-host:
    name: Pi host adapter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:pi

  pi-e2e:
    name: Pi host E2E (Docker, mock model)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
      - run: npm run test:pi:e2e:docker

  neural-evaluation:
    name: Neural embedding evaluation
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/transformers-cache
          key: neural-evaluation-${{ runner.os }}-${{ hashFiles('src/storage/embedding-neural.ts', 'package-lock.json') }}
      - run: npm ci
      - run: npm run test:eval -- --reporter=json --outputFile=artifacts/neural-evaluation.json
        env:
          REMEM_TRANSFORMERS_CACHE_DIR: ${{ runner.temp }}/transformers-cache
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neural-evaluation
          path: artifacts/neural-evaluation.json
          if-no-files-found: error
          retention-days: 14
